# Backend API only.
# Persistent data lives in Supabase PostgreSQL — do not run Postgres in Compose.
#
# Secrets (DATABASE_URL, Supabase keys) are loaded from the host `.env` file.
# Do not embed real credentials in this file.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algo-trading-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-algo-trading-backend}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Values resolved from the shell environment / `.env` — never hard-coded here.
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    restart: unless-stopped
    # VPS-portable: no Hostinger-specific mounts, networks, or labels.
